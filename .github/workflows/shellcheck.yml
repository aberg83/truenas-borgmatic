name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check POSIX shell syntax
        run: sh -n setup-borgmatic.sh

      - name: Run ShellCheck
        run: shellcheck -s sh setup-borgmatic.sh

      - name: Validate example YAML syntax
        run: >-
          ruby -e 'require "yaml"; YAML.safe_load_file("config.yaml.example", aliases: true)'

      # Same Python minor version as TrueNAS SCALE, which requirements.txt
      # is resolved for.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install requirements.txt exactly as the installer does, confirm it
      # pins the same borgmatic as the script, then schema-check the example
      # so an option rename or removal is caught here rather than at the
      # first nightly run after an upgrade.
      - name: Install hash-locked requirements and validate example config
        run: |
          version="$(sed -n 's/^BORGMATIC_VERSION="\(.*\)"$/\1/p' setup-borgmatic.sh)"
          test -n "$version"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes \
              --only-binary :all: -r requirements.txt
          test "$("$RUNNER_TEMP/venv/bin/borgmatic" --version)" = "$version"
          "$RUNNER_TEMP/venv/bin/borgmatic" config validate --config config.yaml.example
