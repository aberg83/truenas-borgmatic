name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check POSIX shell syntax
        run: sh -n setup-borgmatic.sh

      - name: Run ShellCheck
        run: shellcheck -s sh setup-borgmatic.sh

      - name: Validate example YAML syntax
        run: >-
          ruby -e 'require "yaml"; YAML.safe_load_file("config.yaml.example", aliases: true)'

      # Schema-check the example against the exact borgmatic version the
      # installer pins, so an option rename or removal is caught here rather
      # than at the first nightly run after an upgrade.
      - name: Validate example against pinned borgmatic schema
        run: |
          version="$(sed -n 's/^BORGMATIC_VERSION="\(.*\)"$/\1/p' setup-borgmatic.sh)"
          test -n "$version"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "borgmatic==$version"
          "$RUNNER_TEMP/venv/bin/borgmatic" config validate --config config.yaml.example
