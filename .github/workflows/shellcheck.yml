name: Shell checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check POSIX shell syntax
        run: sh -n setup-borgmatic.sh

      - name: Run ShellCheck
        run: shellcheck -s sh setup-borgmatic.sh
